plugins {
    id 'org.springframework.boot' version '2.7.18'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
    id 'java'
    id "com.netflix.dgs.codegen" version "5.0.6"
    id "com.diffplug.spotless" version "6.2.1"
}

version = '0.0.1-SNAPSHOT'
sourceCompatibility = '11'
targetCompatibility = '11'

// Security-driven overrides of the versions managed by the Spring Boot BOM.
ext['spring-framework.version'] = '5.3.39'
ext['spring-security.version'] = '5.8.16'
ext['tomcat.version'] = '9.0.118'
// Jackson stays on 2.18.x: 2.19's jackson-module-kotlin needs a newer Kotlin stdlib
// than the one Netflix DGS 4.9 brings in.
ext['jackson-bom.version'] = '2.18.8'
ext['snakeyaml.version'] = '2.4'
ext['assertj.version'] = '3.27.3'
ext['rest-assured.version'] = '5.5.1'
ext['commons-lang3.version'] = '3.18.0'
// Logback stays on 1.2.x: 1.3+/1.5+ require SLF4J 2.x, which Spring Boot 2.7's
// LogbackLoggingSystem does not support.
ext['logback.version'] = '1.2.13'

spotless {
    java {
        target project.fileTree(project.rootDir) {
            include '**/*.java'
            exclude 'build/generated/**/*.*', 'build/generated-examples/**/*.*'
        }
        googleJavaFormat()
    }
}

repositories {
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-hateoas'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.3.2'
    implementation 'com.netflix.graphql.dgs:graphql-dgs-spring-boot-starter:4.9.21'
    implementation 'org.flywaydb:flyway-core'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.2'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.2',
                'io.jsonwebtoken:jjwt-jackson:0.11.2'
    implementation 'joda-time:joda-time:2.10.13'
    implementation 'org.xerial:sqlite-jdbc:3.49.1.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'io.rest-assured:rest-assured:5.5.1'
    testImplementation 'io.rest-assured:json-path:5.5.1'
    testImplementation 'io.rest-assured:xml-path:5.5.1'
    testImplementation 'io.rest-assured:spring-mock-mvc:5.5.1'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:2.3.2'

    // Transitive dependencies pulled in by Netflix DGS that are not covered by the
    // Spring Boot BOM and need security upgrades of their own.
    constraints {
        implementation('com.graphql-java:graphql-java:17.4')
        implementation('com.google.protobuf:protobuf-java:3.25.5')
    }
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('clean') {
    doFirst {
        delete './dev.db'
    }
}

tasks.named('generateJava') {
    schemaPaths = ["${projectDir}/src/main/resources/schema"] // List of directories containing schema files
    packageName = 'io.spring.graphql' // The package name to use to generate sources
}
