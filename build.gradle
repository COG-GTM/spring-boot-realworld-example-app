plugins {
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id "com.netflix.dgs.codegen" version "7.0.1"
    id "com.diffplug.spotless" version "6.25.0"
}

version = '0.0.1-SNAPSHOT'

// Override Spring Boot 3.5.16 BOM-managed versions with patched releases to
// clear known CVEs surfaced by Snyk (Spring Boot 3.5.x has no newer patch yet).
ext['logback.version'] = '1.5.36'
ext['tomcat.version'] = '10.1.56'
ext['jackson-bom.version'] = '2.21.5'
ext['log4j2.version'] = '2.25.5'
ext['commons-lang3.version'] = '3.18.0'
ext['kotlin.version'] = '2.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat()
    }
}

repositories {
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

configurations.all {
    // The DGS codegen plugin pulls in a newer graphql-java (24.x) than the DGS
    // framework runtime (8.x -> graphql-java 22.1); align them to avoid a
    // java-dataloader version conflict.
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'com.graphql-java'
                && details.requested.name == 'graphql-java') {
            details.useVersion '22.1'
            details.because 'Align with graphql-java managed by DGS 8.x'
        }
        // protobuf-java (pulled transitively by DGS) is not BOM-managed; bump
        // it to clear SNYK-JAVA-COMGOOGLEPROTOBUF-8055227 (buffer overflow).
        if (details.requested.group == 'com.google.protobuf'
                && details.requested.name == 'protobuf-java') {
            details.useVersion '4.27.5'
            details.because 'Fix protobuf-java stack-based buffer overflow'
        }
    }
}

dependencies {
    // Declarative upgrades for transitive dependencies whose Spring Boot 3.5.16
    // BOM-managed versions carry known CVEs. The ext[...] property overrides above
    // drive the resolved versions; these constraints restate them declaratively so
    // static dependency scanners (Snyk PR checks) also see the patched versions.
    constraints {
        implementation('ch.qos.logback:logback-core:1.5.36') { because 'CVE fix: expression injection' }
        implementation('ch.qos.logback:logback-classic:1.5.36') { because 'CVE fix: expression injection' }
        implementation('org.apache.tomcat.embed:tomcat-embed-core:10.1.56') { because 'CVE fix: multiple Tomcat issues' }
        implementation('org.apache.tomcat.embed:tomcat-embed-el:10.1.56') { because 'CVE fix: multiple Tomcat issues' }
        implementation('org.apache.tomcat.embed:tomcat-embed-websocket:10.1.56') { because 'CVE fix: multiple Tomcat issues' }
        implementation('com.fasterxml.jackson.core:jackson-databind:2.21.5') { because 'CVE fix: jackson-databind' }
        implementation('org.apache.logging.log4j:log4j-api:2.25.5') { because 'CVE fix: log4j2' }
        implementation('org.apache.logging.log4j:log4j-to-slf4j:2.25.5') { because 'CVE fix: log4j2' }
        implementation('org.apache.commons:commons-lang3:3.18.0') { because 'CVE fix: uncontrolled recursion' }
        implementation('com.google.protobuf:protobuf-java:4.27.5') { because 'CVE fix: stack-based buffer overflow' }
        implementation('org.jetbrains.kotlin:kotlin-stdlib:2.1.0') { because 'CVE fix: information exposure' }
        implementation('org.jetbrains.kotlin:kotlin-reflect:2.1.0') { because 'CVE fix: information exposure' }
    }

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-hateoas'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
    implementation 'com.netflix.graphql.dgs:graphql-dgs-spring-boot-starter:8.7.1'
    implementation 'org.flywaydb:flyway-core'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.2'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.2',
                'io.jsonwebtoken:jjwt-jackson:0.11.2'
    implementation 'joda-time:joda-time:2.10.13'
    implementation 'org.xerial:sqlite-jdbc:3.41.2.2'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'io.rest-assured:rest-assured'
    testImplementation 'io.rest-assured:json-path'
    testImplementation 'io.rest-assured:xml-path'
    testImplementation 'io.rest-assured:spring-mock-mvc'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.5'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('clean') {
    doFirst {
        delete './dev.db'
    }
}

tasks.named('generateJava') {
    schemaPaths = ["${projectDir}/src/main/resources/schema"] // List of directories containing schema files
    packageName = 'io.spring.graphql' // The package name to use to generate sources
    // Map the Relay-style PageInfo to graphql-java's built-in type, matching the
    // data fetchers which build graphql.relay.DefaultPageInfo.
    typeMapping = ["PageInfo": "graphql.relay.PageInfo"]
}
