plugins {
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id "com.netflix.dgs.codegen" version "8.6.0"
    id "com.diffplug.spotless" version "7.0.4"
}

version = '0.0.1-SNAPSHOT'

// Security patch overrides for Spring Boot managed dependencies.
// Drop each pin once the Spring Boot BOM manages a version >= the one below.
ext['logback.version'] = '1.5.38' // SNYK-JAVA-CHQOSLOGBACK-17675439 (fixed in 1.5.36)
ext['jackson-bom.version'] = '2.21.5' // SNYK-JAVA-COMFASTERXMLJACKSONCORE-17972608
ext['tomcat.version'] = '10.1.57' // SNYK-JAVA-ORGAPACHETOMCATEMBED-17732890, -17733746
ext['commons-lang3.version'] = '3.19.0' // SNYK-JAVA-ORGAPACHECOMMONS-10734078 (fixed in 3.18.0)
ext['log4j2.version'] = '2.25.5' // SNYK-JAVA-ORGAPACHELOGGINGLOG4J-17954276
ext['kotlin.version'] = '2.1.21' // SNYK-JAVA-ORGJETBRAINSKOTLIN-2393744 (fixed in 2.1.0)
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

spotless {
    java {
        target project.fileTree('src') {
            include '**/*.java'
        }
        googleJavaFormat('1.36.1')
    }
}

repositories {
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-hateoas'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
    implementation(platform('com.netflix.graphql.dgs:graphql-dgs-platform-dependencies:10.6.0'))
    implementation 'com.netflix.graphql.dgs:graphql-dgs-spring-graphql-starter'
    implementation 'org.flywaydb:flyway-core'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6',
                'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation 'joda-time:joda-time:2.14.0'
    implementation 'org.xerial:sqlite-jdbc:3.49.1.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'io.rest-assured:rest-assured:5.5.7'
    testImplementation 'io.rest-assured:json-path:5.5.7'
    testImplementation 'io.rest-assured:xml-path:5.5.7'
    testImplementation 'io.rest-assured:spring-mock-mvc:5.5.7'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.5'

}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('clean') {
    doFirst {
        delete './dev.db'
    }
}

tasks.named('generateJava') {
    schemaPaths = ["${projectDir}/src/main/resources/schema"] // List of directories containing schema files
    packageName = 'io.spring.graphql' // The package name to use to generate sources
}
