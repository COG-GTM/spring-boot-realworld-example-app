plugins {
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id "com.netflix.dgs.codegen" version "8.6.0"
    id "com.diffplug.spotless" version "7.2.1"
}

version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'
targetCompatibility = '17'

// Ahead of the versions managed by Spring Boot 3.5.16, which still carry known CVEs.
ext['logback.version'] = '1.5.36'
ext['jackson-bom.version'] = '2.21.5'
ext['tomcat.version'] = '10.1.56'
ext['commons-lang3.version'] = '3.18.0'
ext['log4j2.version'] = '2.25.5'
// Kotlin runtime for the DGS framework; 1.9.25 (Boot's managed version) is flagged by Snyk.
ext['kotlin.version'] = '2.1.21'
ext['kotlin-coroutines.version'] = '1.10.2'

spotless {
    java {
        target project.fileTree(project.rootDir) {
            include '**/*.java'
            exclude 'build/**', '.gradle/**'
        }
        googleJavaFormat()
    }
}

repositories {
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    constraints {
        // Pulled in transitively by the DGS federation support; the version it asks for has a known CVE.
        implementation 'com.google.protobuf:protobuf-java:4.27.5'
    }

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-hateoas'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
    // Pins the whole DGS stack: the codegen plugin drags in a newer DGS platform
    // than the Spring Boot 3 starter, which breaks autoconfiguration.
    implementation enforcedPlatform('com.netflix.graphql.dgs:graphql-dgs-platform-dependencies:9.2.2')
    implementation 'com.netflix.graphql.dgs:graphql-dgs-spring-boot-starter'
    implementation 'org.flywaydb:flyway-core'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7',
                'io.jsonwebtoken:jjwt-jackson:0.12.7'
    implementation 'joda-time:joda-time:2.10.13'
    implementation 'org.xerial:sqlite-jdbc:3.53.1.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'io.rest-assured:rest-assured:5.5.7'
    testImplementation 'io.rest-assured:json-path:5.5.7'
    testImplementation 'io.rest-assured:xml-path:5.5.7'
    testImplementation 'io.rest-assured:spring-mock-mvc:5.5.7'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.5'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('clean') {
    doFirst {
        delete './dev.db'
    }
}

tasks.named('generateJava') {
    schemaPaths = ["${projectDir}/src/main/resources/schema"] // List of directories containing schema files
    packageName = 'io.spring.graphql' // The package name to use to generate sources
    typeMapping = ['PageInfo': 'graphql.relay.PageInfo'] // Reuse the Relay type instead of generating one
}


