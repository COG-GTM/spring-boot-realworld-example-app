plugins {
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id "com.netflix.dgs.codegen" version "6.0.3"
    id "com.diffplug.spotless" version "6.25.0"
}

version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Patched versions of transitive dependencies with known advisories.
ext['logback.version'] = '1.5.36'
ext['jackson-bom.version'] = '2.21.5'
ext['tomcat.version'] = '10.1.56'
ext['commons-lang3.version'] = '3.18.0'
ext['log4j2.version'] = '2.25.5'

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat()
    }
}

repositories {
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencyManagement {
    dependencies {
        // DGS' BOM pins kotlin-stdlib 1.9.25, which carries an open advisory.
        dependency 'org.jetbrains.kotlin:kotlin-stdlib:2.1.21'
    }
}

dependencies {
    constraints {
        // Not managed by the Spring Boot BOM; pulled in transitively by DGS.
        implementation 'com.google.protobuf:protobuf-java:4.27.5'
    }

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-hateoas'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
    implementation platform('com.netflix.graphql.dgs:graphql-dgs-platform-dependencies:9.2.2')
    implementation 'com.netflix.graphql.dgs:graphql-dgs-spring-boot-starter'
    implementation 'org.flywaydb:flyway-core'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5',
                'io.jsonwebtoken:jjwt-jackson:0.11.5'
    implementation 'joda-time:joda-time:2.12.5'
    implementation 'org.xerial:sqlite-jdbc:3.43.2.2'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'io.rest-assured:rest-assured'
    testImplementation 'io.rest-assured:json-path'
    testImplementation 'io.rest-assured:xml-path'
    testImplementation 'io.rest-assured:spring-mock-mvc'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.5'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('clean') {
    doFirst {
        delete './dev.db'
    }
}

tasks.named('generateJava') {
    schemaPaths = ["${projectDir}/src/main/resources/schema"] // List of directories containing schema files
    packageName = 'io.spring.graphql' // The package name to use to generate sources
    typeMapping = ["PageInfo": "graphql.relay.PageInfo"]
}
