pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.netflix.dgs.codegen') {
                useModule("com.netflix.graphql.dgs.codegen:graphql-dgs-codegen-gradle:${requested.version}")
            }
        }
    }
}

rootProject.name = 'spring-boot-realworld-example-app'
