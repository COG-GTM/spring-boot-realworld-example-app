# google-java-format (used by the Spotless plugin) reflectively accesses jdk.compiler
# internals, which recent JDKs (11.0.31+/16+) no longer export by default. These
# --add-exports flags let the Spotless task run so `./gradlew build` succeeds.
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=384m --add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
