mybatis.configuration.cache-enabled=true
mybatis.configuration.default-statement-timeout=3000
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.use-generated-keys=true
mybatis.type-handlers-package=io.spring.infrastructure.mybatis
mybatis.mapper-locations=mapper/*.xml

logging.level.io.spring.infrastructure.mybatis.readservice.ArticleReadService=DEBUG
logging.level.io.spring.infrastructure.mybatis.mapper=DEBUG

# Request/response logging with correlation ids. Override per environment via
# application-<profile>.properties (dev, prod, test) or APP_LOGGING_* env vars.
logging.pattern.level=%5p [%X{correlationId:-}]
app.logging.correlation.header-name=X-Correlation-Id
app.logging.correlation.accept-incoming=true
app.logging.http.enabled=true
app.logging.http.include-headers=false
app.logging.http.include-payload=false
app.logging.http.max-payload-length=1000
app.logging.http.exclude-paths=/graphiql/**
app.logging.http.masked-headers=Authorization,Cookie,Set-Cookie
app.logging.http.masked-fields=password,token
app.logging.service.enabled=true
logging.level.io.spring.http=INFO
logging.level.io.spring.service=INFO
