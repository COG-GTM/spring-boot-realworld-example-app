<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GraphiQL</title>
    <style>
        body {
            margin: 0;
        }
        #graphiql {
            height: 100dvh;
        }
        .loading {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }
    </style>
    <!--
     * Note:
     * The ?standalone flag bundles the module along with all of its `dependencies`, excluding `peerDependencies`, into a single JavaScript file.
     * `@emotion/is-prop-valid` is a shim to remove the console error ` module "@emotion /is-prop-valid" not found`. Upstream issue: https://github.com/motiondivision/motion/issues/3126
    -->
    <link
      rel="stylesheet"
      href="https://esm.sh/graphiql@5.4.0/dist/style.css"
      integrity="sha384-TFpQQKp325U5sd3PddH4cS0KOB3Gz/aqdEe12Mqkkq3wm2MGcDhRX5WhWf+o8akh"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://esm.sh/@graphiql/plugin-explorer@5.1.5/dist/style.css"
      integrity="sha384-vTFGj0krVqwFXLB7kq/VHR0/j2+cCT/B63rge2mULaqnib2OX7DVLUVksTlqvMab"
      crossorigin="anonymous"
    />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0",
          "react/": "https://esm.sh/react@19.3.0/",
          "react-dom": "https://esm.sh/react-dom@19.3.0",
          "react-dom/": "https://esm.sh/react-dom@19.3.0/",
          "graphiql": "https://esm.sh/graphiql@5.4.0?standalone&external=react,react-dom,@graphiql/react,graphql",
          "graphiql/": "https://esm.sh/graphiql@5.4.0/",
          "@graphiql/plugin-explorer": "https://esm.sh/@graphiql/plugin-explorer@5.1.5?standalone&external=react,@graphiql/react,graphql",
          "@graphiql/react": "https://esm.sh/@graphiql/react@0.39.0?standalone&external=react,react-dom,graphql,@graphiql/toolkit,@emotion/is-prop-valid",
          "@graphiql/toolkit": "https://esm.sh/@graphiql/toolkit@0.12.1?standalone&external=graphql",
          "graphql": "https://esm.sh/graphql@17.0.2",
          "@emotion/is-prop-valid": "data:text/javascript,"
        },
        "integrity": {
          "https://esm.sh/react@19.3.0": "sha384-gq3XRS6InsfZ3Lv6d+6mBuySvNkEX/1Ciw3jSlg9gL82444AmhVcwtYbpJfKbDqf",
          "https://esm.sh/react-dom@19.3.0": "sha384-xodfSorG86jrGERFAa4P/93Hfsvm7H8zpgSaybN6ruXaACScu/R7nOuoDgCfep8l",
          "https://esm.sh/graphiql@5.4.0": "sha384-moUMjxK/ZmHQE08otOtzYT/Zke32MqPb9l0uUXUdsf8aXl53LPYBciaAf9ON2nuR",
          "https://esm.sh/graphiql@5.4.0?standalone&external=react,react-dom,@graphiql/react,graphql": "sha384-P5rs3WtMR+YUHbk+eUuomiB3Grin+04e9jKjuOY5KMBdjnl/qOUaCALfnVqVpIL8",
          "https://esm.sh/@graphiql/plugin-explorer@5.1.5": "sha384-hIrTiRjlICooYpU/kh97YrhFmYbV5WhIa37reJgertKXzyaM6kzkJaDUlQWs9+vb",
          "https://esm.sh/@graphiql/react@0.39.0?standalone&external=react,react-dom,graphql,@graphiql/toolkit,@emotion/is-prop-valid": "sha384-snSfFGTvNof5jyaw3xkRx7zsKRy9DWiljMvYXoo+zIwrhQv/h2pWOH81boYwk5P2",
          "https://esm.sh/@graphiql/toolkit@0.12.1?standalone&external=graphql": "sha384-+cNTwZgIW33q7A4E+ZoCMqzcXdfVIc2VthQvJ0uDpRXERBWYuDKPVMzvdQU8x48o",
          "https://esm.sh/graphql@17.0.2": "sha384-IPvlcmnvWT91sKqwbg9MxPXJUuPmSdwXCp22x6hcbBkAEhlfSKkMLR3v19K9iRUp"
        }
      }
    </script>
    <script type="module">
        import React from 'react';
        import ReactDOM from 'react-dom/client';
        import { GraphiQL, HISTORY_PLUGIN } from 'graphiql';
        import { createGraphiQLFetcher } from '@graphiql/toolkit';
        import { explorerPlugin } from '@graphiql/plugin-explorer';
        import 'graphiql/setup-workers/esm.sh';

        const params = new URLSearchParams(window.location.search);
        const path = params.get("path") || "/graphql";
        const url = `${location.protocol}//${location.host}${path}`;
        const wsPath = params.get("wsPath") || "/graphql";
        const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const subscriptionUrl = `${wsProtocol}//${location.host}${wsPath}`;
        const gqlFetcher = createGraphiQLFetcher({'url': url, 'subscriptionUrl': subscriptionUrl});
        const plugins = [HISTORY_PLUGIN, explorerPlugin()];
        const xsrfToken = document.cookie.match(new RegExp('(?:^| )XSRF-TOKEN=([^;]+)'));
        const initialHeaders = xsrfToken ? `{ "X-XSRF-TOKEN" : "${ xsrfToken[1] }" }` : `{}`;

        function App() {
            return React.createElement(GraphiQL, {
                fetcher: gqlFetcher,
                defaultEditorToolsVisibility: true,
                headerEditorEnabled: true,
                shouldPersistHeaders: true,
                initialHeaders: initialHeaders,
                plugins: plugins,
            });
        }

        const container = document.getElementById('graphiql');
        const root = ReactDOM.createRoot(container);
        root.render(React.createElement(App));
    </script>
</head>
<body>
<div id="graphiql"><div class="loading">Loading...</div></div>
</body>
</html>
