[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conduit"
version = "0.0.1"
description = "Python (FastAPI) port of the Spring Boot RealWorld/Conduit example app"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.111.0",
    "pydantic==2.7.1",
    "uvicorn==0.29.0",
    "SQLAlchemy==2.0.30",
    "alembic==1.13.1",
    "pyjwt==2.8.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart==0.0.9",
]

[project.optional-dependencies]
test = [
    "pytest==8.2.0",
    "httpx==0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["conduit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
